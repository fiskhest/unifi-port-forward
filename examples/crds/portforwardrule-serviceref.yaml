apiVersion: unifi-port-forward.fiskhe.st/v1alpha1
kind: PortForwardRule
metadata:
  name: web-service-http
  namespace: production
  labels:
    app: web-service
spec:
  # A bare number, a quoted range ("8000-8100") or a quoted list ("80,443").
  externalPort: 80
  protocol: tcp
  # serviceRef resolves both the destination IP and the internal port from the
  # Service, so destinationPort is neither needed nor used here.
  serviceRef:
    name: web-service
    port: http
  enabled: true
  description: "Production web service HTTP access"
  interface: "wan"
  logEnabled: false
